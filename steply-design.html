<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steply</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: #C8B89A;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.phone {
  width: 390px;
  height: 844px;
  border-radius: 44px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transform-origin: center center;
}

/* ── TOP ── */
.s-top {
  background: #F5F0E8;
  padding: 32px 20px 20px;
  flex-shrink: 0;
}

.s-heading {
  font-family: 'Bricolage Grotesque', "Helvetica Neue", Arial, sans-serif;
  font-weight: 600;
  font-size: 134px;
  letter-spacing: -6px;
  line-height: 1;
  color: #4A6FD4;
}

.s-tagline {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-weight: 400;
  font-size: 24px;
  letter-spacing: 0px;
  line-height: 1;
  color: #4A6FD4;
  margin-top: 8px;
}

/* ── MIDDLE ── */
.s-middle {
  flex: 1;
  overflow: hidden;
}

.s-middle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ── BOTTOM ── */
.s-bottom {
  background: #F5F0E8;
  padding: 20px;
  flex-shrink: 0;
}

.s-btn {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-weight: 500;
  font-size: 24px;
  letter-spacing: 0px;
  color: #4A6FD4;
  background: #FFFFFF;
  border: none;
  border-radius: 12px;
  width: 100%;
  padding: 16px 24px;
  cursor: pointer;
  display: block;
  text-align: center;
}
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- TOP -->
  <div class="s-top">
    <div class="s-heading">Steply</div>
    <p class="s-tagline">just talk. we'll figure out what actually matters today.</p>
  </div>

  <!-- MIDDLE -->
  <div class="s-middle">
    <img src="chaos-desk.jpg" alt="">
  </div>

  <!-- BOTTOM -->
  <div class="s-bottom">
    <button class="s-btn">get started</button>
  </div>

</div>

<script>
function scalePhone() {
  const phone = document.getElementById('phone');
  const pad = 24;
  const sx = (window.innerWidth - pad) / 390;
  const sy = (window.innerHeight - pad) / 844;
  const s = Math.min(1, sx, sy);
  phone.style.transform = s < 1 ? `scale(${s.toFixed(4)})` : '';
}
scalePhone();
window.addEventListener('resize', scalePhone);
</script>

</body>
</html>
